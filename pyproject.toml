[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-to-x"
version = "0.1.0"
description = "Compile transformer attention into address/write operators and test resident temporal memories."
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
pretrained = ["torch>=2.3", "transformers>=4.45,<5", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
